# ==============================================================================
# AUTOMATED PIPELINE ORCHESTRATION: DATA & AI CO-RUNNER
# ==============================================================================
name: Daily Basketball Data & AI Plays Pipeline

on:
  schedule:
    # Runs automatically every single day at 12:00 PM UTC (8:00 AM EST)
    # This timing ensures today's game lines and daily stats are freshly loaded
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to click a button and trigger it manually anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Essential permission allowing the GitHub Runner to save files to your repo
      
    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Enables lightning-fast pre-compiled package downloads

      - name: 3. Install System Dependencies & R Packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::wehoop
            any::dplyr
            any::readr
            any::pacman
            any::httr2
            any::jsonlite
            any::janitor
            any::stringr
            any::lubridate

      - name: 4. Execute Data Scraper (wehoop)
        run: Rscript scrape_season.R

      - name: 5. Execute Claude Analytics Engine
        env:
          # Passes your private security key straight into the R script safely
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: Rscript get_daily_plays.R

      - name: 6. Push Fresh Data and Selections to Repository
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Stages the automated scrape files and your new daily markdown outputs
          git add data/wnba_pbp_2026.csv predictions/
          git commit -m "Automated Pipeline Sync: Data Update + Daily Claude Plays [$(date +'%Y-%m-%d')]" || echo "No pipeline modifications detected today."
          git push origin main || echo "Remote push skipped."
# ==============================================================================
